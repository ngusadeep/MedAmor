[project]
name = "medaudit-backend"
version = "0.1.0"
description = "Backend API for MedAudit medical audit system"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    # DB
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # HTTP / integration
    "httpx>=0.27.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",  # 4.1+ raises on >72 bytes; passlib's internal test fails
    # Task queue (RabbitMQ)
    "celery>=5.3.0",
    "aio-pika>=9.4.0",
    # Vector DB / RAG (ChromaDB + embeddings)
    "chromadb>=0.4.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-openai>=0.2.0",
    "fastembed>=0.4.0",
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
    # Observability (optional)
    "langsmith>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
