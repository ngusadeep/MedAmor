# MedAudit Demo – Breast Cancer Screening Audit
# Frontend → Backend → EHR service (FastAPI). Backend gets patient data from EHR service.
# Run from /demo:  docker compose up --build
# App: http://localhost   API: http://localhost/api   EHR data: http://ehr:8000 (internal)
version: '3.8'

services:
  # ---------- EHR Data Service (FastAPI): serves patients list + patient bundle for backend ----------
  ehr:
    build:
      context: ./ehr
      dockerfile: Dockerfile
    container_name: ehr_service
    environment:
      EHR_DATA_PATH: /data
    volumes:
      - ./ehr:/data:ro
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ---------- HAPI FHIR (optional; for raw FHIR upload/query) ----------
  hapi_db:
    image: postgres:15-alpine
    container_name: hapi_db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_dev_password
    volumes:
      - hapi_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hapi_fhir:
    image: hapiproject/hapi:latest
    container_name: hapi_fhir
    ports:
      - "9080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi_db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi_dev_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "60000"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_OPENAPI_ENABLED: "true"
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: http://localhost:9080/fhir
    depends_on:
      hapi_db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Redis (Celery) ----------
  redis:
    image: redis:7-alpine
    container_name: medaudit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- MedAudit backend (AI + backend logic) ----------
  medaudit_db:
    image: postgres:16-alpine
    container_name: medaudit_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medaudit
    volumes:
      - medaudit_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medaudit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medaudit_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medaudit_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@medaudit_db:5432/medaudit
      CHROMA_PERSIST_DIR: /app/chroma_data
      EHR_SERVICE_URL: http://ehr:8000
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET_KEY: change_me_jwt_secret_min_32_chars
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1
      MEDICAL_KB_PATH: /app/docs/Medical_KB
    volumes:
      - chroma_data:/app/chroma_data
      - ./docs/Medical_KB:/app/docs/Medical_KB:ro
    depends_on:
      medaudit_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ehr:
        condition: service_started
    restart: unless-stopped

  medaudit_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medaudit_worker
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@medaudit_db:5432/medaudit
      CHROMA_PERSIST_DIR: /app/chroma_data
      EHR_SERVICE_URL: http://ehr:8000
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET_KEY: change_me_jwt_secret_min_32_chars
      MEDICAL_KB_PATH: /app/docs/Medical_KB
    volumes:
      - chroma_data:/app/chroma_data
      - ./docs/Medical_KB:/app/docs/Medical_KB:ro
    depends_on:
      medaudit_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      medaudit_backend:
        condition: service_started
      ehr:
        condition: service_started
    restart: unless-stopped

  medaudit_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medaudit_beat
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@medaudit_db:5432/medaudit
      CHROMA_PERSIST_DIR: /app/chroma_data
      EHR_SERVICE_URL: http://ehr:8000
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET_KEY: change_me_jwt_secret_min_32_chars
      MEDICAL_KB_PATH: /app/docs/Medical_KB
    volumes:
      - chroma_data:/app/chroma_data
      - ./docs/Medical_KB:/app/docs/Medical_KB:ro
    depends_on:
      medaudit_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      medaudit_backend:
        condition: service_started
      ehr:
        condition: service_started
    restart: unless-stopped

  # ---------- MedAudit frontend (UI) ----------
  medaudit_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: medaudit_frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: medaudit_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - medaudit_backend
      - medaudit_frontend
    restart: unless-stopped

volumes:
  hapi_db_data:
  redis_data:
  medaudit_db_data:
  chroma_data:
