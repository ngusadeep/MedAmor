# EHR services – optional components for EHR/FHIR integration
# No profile: no services start
# --profile ehr_data : EHR data service (requires medaudit-app image + medaudit_db)
# --profile hapi     : HAPI FHIR server + its own Postgres
#
# Run from any directory, explicitly passing the env file:
#   docker compose -f ehr/docker-compose.yml --env-file .env --profile hapi up
#
# Combined with main stack (from project root):
#   docker compose -f docker-compose.yml -f ehr/docker-compose.yml --profile ehr_data up --build
#   docker compose -f docker-compose.yml -f ehr/docker-compose.yml --profile hapi up
#   docker compose -f docker-compose.yml -f ehr/docker-compose.yml --profile ehr_data --profile hapi up --build

services:
  # ---------- EHR Data Service (mock/local EHR; requires medaudit-app image) ----------
  ehr:
    image: medaudit-app
    container_name: ehr_service
    working_dir: /app
    command: ["uvicorn", "ehr.server:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["ehr_data"]
    env_file: ../.env
    environment:
      DATABASE_URL: ${EHR_DATABASE_URL}
      EHR_DATA_PATH: /app/ehr
      PYTHONPATH: /app:/app/ehr
    volumes:
      - ./:/app/ehr:ro
    ports:
      - "8001:8000"
    networks:
      - medaudit_default
    restart: unless-stopped

  # ---------- HAPI FHIR ----------
  hapi_db:
    image: postgres:15-alpine
    container_name: hapi_db
    profiles: ["hapi"]
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_dev_password
    volumes:
      - hapi_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hapi_fhir:
    image: hapiproject/hapi:latest
    container_name: hapi_fhir
    profiles: ["hapi"]
    ports:
      - "8001:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi_db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi1234
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "60000"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_OPENAPI_ENABLED: "true"
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: http://localhost:8001/fhir
    depends_on:
      hapi_db:
        condition: service_healthy
    restart: unless-stopped

networks:
  medaudit_default:
    external: true

volumes:
  hapi_db_data:
